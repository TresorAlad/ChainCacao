# API en mode développement (pas de rebuild d'image Go à chaque modification).
#
# 1) Arrêter le conteneur api « prod » (image compilée) :
#    docker compose stop api
#
# 2) Lancer l'API dev (code monté, go run dans le conteneur) :
#    docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d api_dev
#
# 3) Logs : docker compose -f docker-compose.yml -f docker-compose.dev.yml logs -f api_dev
#
# Premier démarrage : `go run` peut télécharger ~centaines de Mo de modules puis compiler
# (plusieurs minutes sur une petite EC2). Ne pas interrompre avant la ligne
# « API ChainCacao ecoute sur :8080 ». Les volumes go_mod_cache / go_build_cache gardent le cache
# entre les redémarrages du conteneur.
#
# Revenir à l'image prod : docker compose -f docker-compose.yml -f docker-compose.dev.yml stop api_dev && docker compose up -d --build api
#
services:
  api_dev:
    image: golang:1.25-alpine
    pull_policy: if_not_present
    working_dir: /src
    volumes:
      - .:/src
      - ../fabric-samples/test-network/organizations:/fabric-crypto:ro
      - ./secrets:/secrets:ro
      # Cache Go entre redémarrages (évite de retélécharger tous les modules à chaque `up`)
      - go_mod_cache:/gomodcache
      - go_build_cache:/gocache
    command:
      - sh
      - -c
      - apk add --no-cache git ca-certificates wget >/dev/null && go run ./cmd/api
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: postgresql://chaincacao:chaincacao@postgres:5432/chaincacao?sslmode=disable
      GOMODCACHE: /gomodcache
      GOCACHE: /gocache
      # false = tenter le vrai Gateway si FABRIC_PEER_ENDPOINT est dans .env ; monter fabric-samples
      # (volumes ci-dessus). Si pas de réseau Fabric : laisser FABRIC_PEER_ENDPOINT vide → ledger mémoire.
      USE_INMEMORY_FABRIC: "false"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      # Premier `go mod download` + compile sur petite VM : dépasser 90s facilement
      start_period: 300s

volumes:
  go_mod_cache:
  go_build_cache:
