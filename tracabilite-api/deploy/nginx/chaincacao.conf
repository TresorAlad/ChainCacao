# Reverse proxy TLS pour ChainCacao API (Let's Encrypt via certbot)
# Placer dans /etc/nginx/sites-available/chaincacao.conf puis:
#   sudo ln -s /etc/nginx/sites-available/chaincacao.conf /etc/nginx/sites-enabled/
#   sudo certbot --nginx -d api.chaincacao.tg
#   sudo nginx -t && sudo systemctl reload nginx

upstream chaincacao_api {
    server 127.0.0.1:8080;
    keepalive 32;
}

server {
    listen 80;
    server_name api.chaincacao.tg;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name api.chaincacao.tg;

    # Certificats Let's Encrypt (chemins generes par certbot)
    ssl_certificate     /etc/letsencrypt/live/api.chaincacao.tg/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.chaincacao.tg/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    client_max_body_size 6m;

    location / {
        proxy_pass http://chaincacao_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
